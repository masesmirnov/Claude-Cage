name: Bug report
description: Report an error, unexpected behavior or a feature that does not work.
title: "[Bug] "
labels: [bug]
body:
  - type: markdown
    attributes:
      value: |
        Search existing issues first, and fill in the version and environment where the problem happened so it can be reproduced.
        You can attach logs and screenshots below; remove sensitive information such as passwords, tokens and subscription links before uploading.
  - type: textarea
    id: problem
    attributes:
      label: Problem and actual behavior
      description: What were you doing? What happened? Keep the original text of any error.
      placeholder: After clicking Start, … appears and the screen shows …
    validations:
      required: true
  - type: input
    id: version
    attributes:
      label: Cage version
      description: Enter the full version you were using when the problem happened, including any prerelease or development suffix.
      placeholder: For example v0.1.7 or v0.1.7-rc.1
    validations:
      required: true
  - type: input
    id: commit
    attributes:
      label: Commit SHA
      description: For source builds, enter the commit the build used; you can run git rev-parse HEAD in the source folder. If you use an installer and don't know the commit, enter "unknown (installer)" and note the download source below.
      placeholder: Full or short commit; unknown (installer)
    validations:
      required: true
  - type: input
    id: installation
    attributes:
      label: Install or build source
      description: Enter the release link, installer file name, CI build link or how you built from source; if the problem started after an update, add the version before the update.
      placeholder: GitHub Releases installer / CI build / local source build
    validations:
      required: true
  - type: dropdown
    id: host-system
    attributes:
      label: Host system
      description: The host is the computer that runs Cage. The issue gets a label for the selected system and goes to that platform's maintainers.
      options:
        - macOS
        - Windows
        - Linux
    validations:
      required: true
  - type: input
    id: host-os
    attributes:
      label: Host version and architecture
      description: Enter the system name, full version (including the build number on Windows) and processor architecture; for remote connections, also note the remote host's system.
      placeholder: macOS 26.4 arm64 / Windows 11 24H2 (26100.x) x64 / Ubuntu 24.04 x86_64
    validations:
      required: true
  - type: dropdown
    id: guest-system
    attributes:
      label: Guest system
      description: The guest is the system that runs inside Cage. If it is not installed yet or does not start, choose the system selected during installation.
      options:
        - macOS
        - Windows
        - Linux
        - Not involved or not sure
    validations:
      required: true
  - type: input
    id: guest-os
    attributes:
      label: Guest version and architecture
      description: Enter the system name, version and architecture; if it is not installed yet or does not start, note the current stage.
      placeholder: Ubuntu 24.04 arm64 / Windows 11 x64 / macOS 26.4 arm64; not installed, stopped at …
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: Steps to reproduce
      description: Describe the steps in order, starting from opening Cage, including relevant settings and prerequisites. For intermittent problems, describe the known triggers and how often it happens.
      placeholder: |
        1. Open Cage, choose …
        2. Set …
        3. Click …
        4. … appears (every time / sometimes)
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: Expected behavior
      description: What did you expect to happen after the steps above?
    validations:
      required: true
  - type: textarea
    id: logs
    attributes:
      label: Logs, screenshots or recordings
      description: Paste related errors and logs, or drag in screenshots or recordings. Keep the information from before and after the problem, and remove sensitive content.
  - type: textarea
    id: context
    attributes:
      label: Additional information
      description: If Claude Code, Claude Desktop, the browser or a phone is involved, note its version; you can also add what you already tried, recent configuration changes and the last version that worked.
