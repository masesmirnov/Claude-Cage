name: Contribution
description: Share a fix, implementation code or a patch through an issue for maintainers to evaluate and integrate.
title: "[Contribution] "
labels: [contribution]
body:
  - type: markdown
    attributes:
      value: |
        Contribution flow: submit this issue first; after maintainers approve it they invite you as a collaborator; after you accept, open a pull request, which is merged once it passes review.
        After a maintainer adds the accepted label, the automation sends a collaborator invitation and explains the next steps here. Collaborators have write access to the whole repository.
        You can paste code or a diff directly, or provide a patch attachment, a fork branch or links to specific commits; no pull request is needed before review.
        See the [contributing guide](https://github.com/Lee-xeo/Claude-Cage/blob/main/.github/CONTRIBUTING.md) for the detailed steps.
        If you only have a feature need, choose "Feature request"; to report a problem, choose "Bug report".
        Remove sensitive information such as passwords, tokens and subscription links before uploading code, configuration or logs.
  - type: textarea
    id: problem
    attributes:
      label: Problem to solve and related issues
      description: Describe the current behavior, the expected result and what the proposal should achieve; if there are related issues, add their numbers or links.
      placeholder: |
        Related issue: #123 (omit if none)
        Current problem: …
        Desired result: …
    validations:
      required: true
  - type: input
    id: base-version
    attributes:
      label: Cage version or commit it is based on
      description: For code or patches, note the commit SHA it is based on (you can run git rev-parse HEAD in the source folder); for procedures, note the version it applies to, and say so clearly if not confirmed yet.
      placeholder: Version / commit SHA / applicable version not confirmed yet
    validations:
      required: true
  - type: dropdown
    id: host-systems
    attributes:
      label: Host systems involved
      description: The host is the computer that runs Cage; you can choose several, or all of them if it applies to every platform. The issue gets labels for the selected systems and goes to those platforms' maintainers.
      multiple: true
      options:
        - macOS
        - Windows
        - Linux
        - Not involved or not sure
    validations:
      required: true
  - type: dropdown
    id: guest-systems
    attributes:
      label: Guest systems involved
      description: The guest is the system that runs inside Cage; you can choose several, or all of them if it applies to every guest.
      multiple: true
      options:
        - macOS
        - Windows
        - Linux
        - Not involved or not sure
    validations:
      required: true
  - type: textarea
    id: platforms
    attributes:
      label: System versions and architectures
      description: Describe the system versions and architectures the proposal covers; enter "no restriction" if there are none.
      placeholder: |
        Host: …
        Guest: …
    validations:
      required: true
  - type: textarea
    id: solution
    attributes:
      label: Proposal and materials
      description: Explain how it solves the problem, why it works, and the files or steps involved. You can paste code, a diff or a patch attachment here, or provide an accessible fork branch or links to specific commits.
      placeholder: |
        Approach: …
        Changes or steps: …
        Code, patch or commit links: … (if any)
    validations:
      required: true
  - type: textarea
    id: verification
    attributes:
      label: Verification and results
      description: Describe the system, steps or commands used for verification, and the results before and after the change. Clearly mark untested proposals or platforms so maintainers can continue verifying.
      placeholder: |
        Test environment: …
        Steps or commands: …
        Before: …
        After: …
        Not verified yet: …
    validations:
      required: true
  - type: textarea
    id: impact
    attributes:
      label: Impact and known limitations
      description: Describe whether it affects other features, platforms, existing configuration or personal data, whether migration is needed and any known side effects; say so clearly if not assessed yet.
    validations:
      required: true
  - type: textarea
    id: context
    attributes:
      label: Additional notes and references
      description: You can attach screenshots, logs, design rationale or reference implementations; when citing other people's code, note the source and license.
