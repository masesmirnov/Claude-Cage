name: Feature request
description: Suggest a new feature or an improvement to an existing one.
title: "[Feature] "
labels: [enhancement]
body:
  - type: markdown
    attributes:
      value: |
        Search existing requests first, and describe the concrete use case and the problem you want solved.
        If an existing feature shows an error or does not work, choose "Bug report" and include reproduction details.
  - type: textarea
    id: problem
    attributes:
      label: Use case and problem
      description: What task do you want to do? Where do you get stuck now? Give a concrete example.
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: Feature to add or improve
      description: Describe how you would like it to work and what the result should be.
    validations:
      required: true
  - type: textarea
    id: alternatives
    attributes:
      label: Current alternatives
      description: How do you do this now? What is missing in those ways? You can also say there is no alternative.
  - type: dropdown
    id: host-systems
    attributes:
      label: Host systems involved
      description: The host is the computer that runs Cage; you can choose several, or all of them if it applies to every platform. The issue gets labels for the selected systems and goes to those platforms' maintainers.
      multiple: true
      options:
        - macOS
        - Windows
        - Linux
        - Not involved or not sure
    validations:
      required: true
  - type: dropdown
    id: guest-systems
    attributes:
      label: Guest systems involved
      description: The guest is the system that runs inside Cage; you can choose several, or all of them if it applies to every guest.
      multiple: true
      options:
        - macOS
        - Windows
        - Linux
        - Not involved or not sure
    validations:
      required: true
  - type: input
    id: version
    attributes:
      label: Current Cage version
      description: If the request relates to an existing feature, enter the version; for source builds you can add the commit.
  - type: textarea
    id: context
    attributes:
      label: References and additional information
      description: You can attach mockups, links to similar features or the expected workflow; remove sensitive information before uploading.
