name: Documentation issue
description: Report a documentation error, outdated content, a missing step or a translation problem.
title: "[Docs] "
labels: [documentation]
body:
  - type: input
    id: location
    attributes:
      label: Documentation location
      description: Enter the web link or repository file path and the section; for translation problems, also note the language.
      placeholder: Install section of README.md / docs/guide/maintenance.md / web link
    validations:
      required: true
  - type: textarea
    id: problem
    attributes:
      label: What is wrong in the documentation
      description: Point out the error, ambiguity or missing content. If following a guide failed, include the steps and the actual result.
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: What should be added or fixed
      description: Describe what you want the documentation to explain; include the exact fix or its basis if you have one.
    validations:
      required: true
  - type: input
    id: version
    attributes:
      label: Related version or commit
      description: If it relates to a Cage version or documentation commit, enter the version, the commit or a documentation link pinned to that commit.
  - type: textarea
    id: environment
    attributes:
      label: Related systems and materials
      description: For install or usage steps, note the host and guest systems and versions; you can attach screenshots or reference links, with sensitive information removed before uploading.
