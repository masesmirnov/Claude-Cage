name: Question
description: Ask about installation, configuration or everyday use.
title: "[Question] "
labels: [question]
body:
  - type: markdown
    attributes:
      value: |
        Check the README, the user guide and existing issues first.
        If you already hit an error or unexpected behavior, choose "Bug report" and fill in the version and reproduction steps.
  - type: textarea
    id: question
    attributes:
      label: What do you want to know?
      description: Describe the task you want to do and what is unclear so far.
    validations:
      required: true
  - type: textarea
    id: attempted
    attributes:
      label: Documentation read or things tried
      description: Include the documentation links you used, what you tried and the results, so we can give a specific answer.
    validations:
      required: true
  - type: input
    id: version
    attributes:
      label: Cage version
      description: Enter the full version you use now; for source builds you can add the commit, and if it is not installed yet, enter "not installed yet".
    validations:
      required: true
  - type: textarea
    id: environment
    attributes:
      label: Host and guest systems
      description: Enter the system name, version and architecture of the host and the guest; if not installed yet, describe the systems you plan to use.
      placeholder: |
        Host:
        Guest:
    validations:
      required: true
  - type: textarea
    id: context
    attributes:
      label: Additional information
      description: You can attach screenshots or related configuration; remove sensitive information such as passwords, tokens and subscription links before uploading.
